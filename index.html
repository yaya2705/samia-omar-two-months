<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samia & Omar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- STARS BACKGROUND -->
  <div id="stars-container"></div>

  <!-- SECTION 01 -->
  <section class="hero section">
    <div class="hero-content reveal">
      <h1>Samia & Omar</h1>
      <p class="subtitle">Two Months</p>
    </div>
  </section>

  <!-- SECTION 02 -->
  <section class="memory section">

    <div class="section-number">02</div>

    <div class="memory-grid">

      <!-- PHOTO ALBUM -->
      <div class="carousel-container reveal">

        <div class="carousel-slide active">
          <img src="images/IMG_8890.jpg" alt="Memory 1">
          <p class="carousel-caption" style="display: none;"></p>
        </div>

        <div class="carousel-slide">
          <img src="images/IMG_8904.jpg" alt="Memory 2">
          <p class="carousel-caption" style="display: none;"></p>
        </div>

        <div class="carousel-slide">
          <img src="images/IMG_8932.jpg" alt="Memory 3">
          <p class="carousel-caption" style="display: none;"></p>
        </div>

        <div class="carousel-slide">
          <img src="images/IMG_8958.jpg" alt="Memory 4">
          <p class="carousel-caption" style="display: none;"></p>
        </div>

        <div class="carousel-slide">
          <img src="images/IMG_8973.jpg" alt="Memory 5">
          <p class="carousel-caption" style="display: none;"></p>
        </div>

        <div class="carousel-slide">
          <img src="images/IMG_8975.jpg" alt="Memory 6">
          <p class="carousel-caption" style="display: none;"></p>
        </div>

        <div class="carousel-slide">
          <img src="images/IMG_8977.jpg" alt="Memory 7">
          <p class="carousel-caption" style="display: none;"></p>
        </div>

        <div class="carousel-slide">
          <img src="images/IMG_8891.jpg" alt="Memory 8">
          <p class="carousel-caption" style="display: none;"></p>
        </div>

        <div class="carousel-controls">

          <button
            class="carousel-btn"
            id="prevSlide"
            type="button"
            aria-label="Previous photo"
          >
            ←
          </button>

          <span
            class="carousel-counter"
            id="carouselCounter"
          >
            1 / 8
          </span>

          <button
            class="carousel-btn"
            id="nextSlide"
            type="button"
            aria-label="Next photo"
          >
            →
          </button>

        </div>

      </div>

    </div>

  </section>

  <script src="script.js"></script>
</body>
</html>

</body>
</html>
